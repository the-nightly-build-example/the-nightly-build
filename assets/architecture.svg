<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1880"
  height="1000"
  viewBox="0 0 1880 1000"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">The Nightly Build production flow</title>
  <desc id="description">
    The orchestrator creates agent context and manages parallel isolated article
    runs. Each run prepares an article pull request before GitHub creates it.
    Successful pull requests are automatically merged and published through
    GitHub Pages. A failed CI check returns to the orchestrator for repair.
  </desc>

  <defs>
    <marker
      id="arrow-gray"
      markerWidth="10"
      markerHeight="10"
      refX="9"
      refY="5"
      orient="auto"
    >
      <path d="M0 0L10 5L0 10Z" fill="#6f828a" />
    </marker>
    <marker
      id="arrow-green"
      markerWidth="10"
      markerHeight="10"
      refX="9"
      refY="5"
      orient="auto"
    >
      <path d="M0 0L10 5L0 10Z" fill="#5f916d" />
    </marker>
    <marker
      id="arrow-red"
      markerWidth="10"
      markerHeight="10"
      refX="9"
      refY="5"
      orient="auto"
    >
      <path d="M0 0L10 5L0 10Z" fill="#a35349" />
    </marker>
    <marker
      id="arrow-gold"
      markerWidth="10"
      markerHeight="10"
      refX="9"
      refY="5"
      orient="auto"
    >
      <path d="M0 0L10 5L0 10Z" fill="#c48216" />
    </marker>
    <style>
      .node {
        stroke-width: 2;
      }
      .title {
        fill: #10212b;
        font: 700 20px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      .copy {
        fill: #5f727b;
        font: 15px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      .label-success {
        fill: #4e7f5c;
        font: 700 14px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        text-anchor: middle;
      }
      .label-failure {
        fill: #944b43;
        font: 700 14px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        text-anchor: middle;
      }
      .flow {
        fill: none;
        stroke: #6f828a;
        stroke-width: 2.5;
        marker-end: url(#arrow-gray);
      }
      .success {
        fill: none;
        stroke: #5f916d;
        stroke-width: 2.5;
        marker-end: url(#arrow-green);
      }
      .failure {
        fill: none;
        stroke: #a35349;
        stroke-width: 2.25;
        stroke-dasharray: 7 6;
        marker-end: url(#arrow-red);
      }
      .request {
        fill: none;
        stroke: #c48216;
        stroke-width: 2.25;
        stroke-dasharray: 6 6;
        marker-end: url(#arrow-gold);
      }
      .request-label {
        fill: #a66d10;
        font: 700 14px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        text-anchor: middle;
      }
      .stage {
        fill: #fbfdfc;
        stroke: #76a3ab;
        stroke-width: 2;
        stroke-dasharray: 9 7;
      }
      .stage-title {
        fill: #10212b;
        font: 700 20px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      .stage-copy {
        fill: #5f727b;
        font: 15px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      .role {
        fill: #fff3d7;
        stroke: #d49620;
        stroke-width: 2;
      }
      .role-title {
        fill: #10212b;
        font: 700 19px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      .role-copy {
        fill: #5f727b;
        font: 14px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      .expand {
        fill: none;
        stroke: #76a3ab;
        stroke-width: 2;
        stroke-dasharray: 6 6;
      }
      .flow-label {
        fill: #5f727b;
        font: 700 14px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        text-anchor: middle;
      }
      .stage-outline {
        stroke-width: 2;
        stroke-dasharray: 9 7;
      }
      .outline-title {
        fill: #5f727b;
        font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
    </style>
  </defs>

  <rect width="1880" height="1000" fill="#fffefb" />

  <rect
    class="node"
    x="30"
    y="80"
    width="350"
    height="120"
    rx="16"
    fill="#fff3d7"
    stroke="#d49620"
  />
  <text class="title" x="55" y="116">Orchestrator</text>
  <text class="copy" x="55" y="148">
    Creates the context each agent needs
  </text>
  <text class="copy" x="55" y="173">
    and manages work to completion.
  </text>

  <rect
    class="node"
    x="520"
    y="80"
    width="350"
    height="120"
    rx="16"
    fill="#e8f2f4"
    stroke="#76a3ab"
  />
  <text class="title" x="545" y="116">Isolated article runs × N</text>
  <text class="copy" x="545" y="148">
    Agents produce articles in parallel,
  </text>
  <text class="copy" x="545" y="173">
    each in an isolated workspace.
  </text>

  <rect
    class="node"
    x="1010"
    y="80"
    width="350"
    height="120"
    rx="16"
    fill="#f1ebf7"
    stroke="#795b95"
  />
  <text class="title" x="1035" y="116">Create Article PR</text>
  <text class="copy" x="1035" y="148">
    Opens a PR for the article and assets.
  </text>
  <text class="copy" x="1035" y="173">
    Includes every exact agent artifact.
  </text>

  <rect
    class="node"
    x="1500"
    y="80"
    width="350"
    height="120"
    rx="16"
    fill="#f1ebf7"
    stroke="#795b95"
  />
  <text class="title" x="1525" y="116">Published website</text>
  <text class="copy" x="1525" y="148">
    Hosted on your GitHub Pages.
  </text>
  <text class="copy" x="1525" y="173">
    Searchable from the-nightly-build.github.io.
  </text>

  <path class="flow" d="M380 140H520" />

  <path class="success" d="M1360 140H1500" />
  <text class="label-success" x="1430" y="124">CI passes</text>

  <path class="failure" d="M1185 80V30H205V80" />
  <text class="label-failure" x="695" y="20">
    CI fails
  </text>

  <path class="expand" d="M695 200V290" />

  <rect
    class="stage"
    x="30"
    y="290"
    width="1330"
    height="670"
    rx="20"
  />
  <text class="stage-title" x="60" y="328">One isolated article run</text>
  <text class="stage-copy" x="60" y="355">
    The orchestrator prepares each role’s exact input. Each role saves an exact output.
  </text>

  <rect class="role" x="60" y="430" width="320" height="120" rx="15" />
  <text class="role-title" x="85" y="469">Writing coach</text>
  <text class="role-copy" x="85" y="500">
    Studies strong writers for this subject.
  </text>
  <text class="role-copy" x="85" y="525">
    Defines how the article should sound.
  </text>

  <rect class="role" x="60" y="720" width="320" height="120" rx="15" />
  <text class="role-title" x="85" y="759">Researcher</text>
  <text class="role-copy" x="85" y="790">
    Finds reliable sources for the article.
  </text>
  <text class="role-copy" x="85" y="815">
    Records verified claims and evidence.
  </text>

  <rect class="role" x="560" y="575" width="320" height="120" rx="15" />
  <text class="role-title" x="585" y="614">Writer</text>
  <text class="role-copy" x="585" y="645">
    Drafts from the prepared inputs.
  </text>
  <text class="role-copy" x="585" y="670">
    Fixes every failed article check.
  </text>

  <rect class="role" x="1010" y="575" width="320" height="120" rx="15" />
  <text class="role-title" x="1035" y="614">Editor</text>
  <text class="role-copy" x="1035" y="645">
    Challenges evidence, reasoning, and prose.
  </text>
  <text class="role-copy" x="1035" y="670">
    Approves only when the article holds up.
  </text>

  <rect
    class="node"
    x="1010"
    y="320"
    width="320"
    height="120"
    rx="15"
    fill="#f1ebf7"
    stroke="#795b95"
  />
  <text class="role-title" x="1035" y="359">Prepare Article PR</text>
  <text class="role-copy" x="1035" y="390">
    Validates the article and agent artifacts.
  </text>
  <text class="role-copy" x="1035" y="415">
    Creates the commit and exact PR request.
  </text>

  <path class="flow" d="M380 490H480V620H560" />
  <path class="flow" d="M380 780H480V650H560" />
  <path class="flow" d="M880 635H1010" />
  <path class="flow" d="M1120 575V440" />
  <text class="flow-label" x="1105" y="512" style="text-anchor: end">
    editor approves
  </text>
  <path class="failure" d="M1220 440V575" />
  <text
    class="label-failure"
    x="1235"
    y="512"
    style="text-anchor: start"
  >
    final check fails
  </text>
  <path class="flow" d="M1170 320V200" />

  <path class="request" d="M600 575V405H220V430" />
  <text class="request-label" x="410" y="395">voice question</text>

  <path class="request" d="M600 695V875H220V840" />
  <text class="request-label" x="410" y="866">source question</text>

  <path class="request" d="M1080 695V765H830V695" />
  <text class="request-label" x="955" y="757">revision request</text>

  <path class="request" d="M1140 695V925H130V840" />
  <text class="request-label" x="635" y="916">evidence request</text>

  <path class="failure" d="M120 720V685H320V720" />
  <text class="label-failure" x="220" y="676">
    source cannot be verified
  </text>

  <path class="failure" d="M680 575V535H820V575" />
  <text class="label-failure" x="750" y="526">
    article check fails
  </text>

  <path class="request" d="M175 290V200" />
  <text class="request-label" x="100" y="250">escalation</text>

  <path class="success" d="M225 200V290" />
  <text class="label-success" x="300" y="250">resolution</text>

  <path class="expand" d="M1360 660H1500" />

  <rect
    class="stage-outline"
    x="1500"
    y="290"
    width="350"
    height="670"
    rx="20"
    fill="#f7fbfb"
    stroke="#76a3ab"
  />
  <text class="outline-title" x="1530" y="328">Nightly Build CLI</text>
  <text class="stage-copy" x="1530" y="355">
    Each agent gets only the context it needs.
  </text>

  <rect
    class="node"
    x="1530"
    y="390"
    width="290"
    height="105"
    rx="15"
    fill="#e9f5ec"
    stroke="#6f9a78"
  />
  <text class="role-title" x="1555" y="424">Search article history</text>
  <text class="role-copy" x="1555" y="454">
    Finds relevant prior coverage.
  </text>
  <text class="role-copy" x="1555" y="477">
    Returns only requested context.
  </text>

  <rect
    class="node"
    x="1530"
    y="535"
    width="290"
    height="105"
    rx="15"
    fill="#e9f5ec"
    stroke="#6f9a78"
  />
  <text class="role-title" x="1555" y="569">Check work</text>
  <text class="role-copy" x="1555" y="599">
    Validates articles and PR inputs.
  </text>
  <text class="role-copy" x="1555" y="622">
    Uses the same rules as CI.
  </text>

  <rect
    class="node"
    x="1530"
    y="680"
    width="290"
    height="105"
    rx="15"
    fill="#e9f5ec"
    stroke="#6f9a78"
  />
  <text class="role-title" x="1555" y="714">Create assets</text>
  <text class="role-copy" x="1555" y="744">
    Renders charts and captures evidence.
  </text>
  <text class="role-copy" x="1555" y="767">
    Saves files with the article.
  </text>

  <rect
    class="node"
    x="1530"
    y="825"
    width="290"
    height="105"
    rx="15"
    fill="#e9f5ec"
    stroke="#6f9a78"
  />
  <text class="role-title" x="1555" y="859">Preview article</text>
  <text class="role-copy" x="1555" y="889">
    Renders the page before handoff.
  </text>
  <text class="role-copy" x="1555" y="912">
    Shows layout and assets in context.
  </text>

</svg>
